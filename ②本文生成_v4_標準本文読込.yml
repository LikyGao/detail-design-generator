          \ extract_section_items(value):\n    data = parse_json(value, [])\n\n  \
          \  if isinstance(data, list):\n        return [x for x in data if isinstance(x,\
          \ dict)]\n\n    if isinstance(data, dict):\n        for key in (\"sections\"\
          , \"section_contents\", \"contents\", \"items\", \"data\"):\n          \
          \  items = data.get(key)\n            if isinstance(items, list):\n    \
          \            return [x for x in items if isinstance(x, dict)]\n\n      \
          \  # {\"1\": {...}, \"1-1\": {...}} のようなMap形式にも対応\n        if data and all(isinstance(v,\
          \ dict) for v in data.values()):\n            result = []\n            for\
          \ map_key, item in data.items():\n                copied = dict(item)\n\
          \                if not any(copied.get(k) for k in (\"id\", \"section_id\"\
