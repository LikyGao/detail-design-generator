          \    result = []\n    if not isinstance(items, list):\n        return result\n\
          \n    for item in items:\n        if isinstance(item, dict):\n         \
          \   block_type = str(item.get(\"type\") or \"paragraph\").strip().lower()\n\
          \            # 標準テンプレートから今回取り込むのは文字本文のみ。\n            if block_type not\
