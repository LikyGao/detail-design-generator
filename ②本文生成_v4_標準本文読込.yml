          \ = []\n    if not isinstance(blocks, list):\n        return result\n\n\
          \    for block in blocks:\n        if not isinstance(block, dict):\n   \
          \         continue\n\n        if str(block.get(\"type\") or \"paragraph\"\
          ).lower() != \"paragraph\":\n            continue\n\n        text = str(block.get(\"\
          text\") or block.get(\"content\") or \"\")\n        if text.strip():\n \
          \           result.append({\n                \"type\": \"paragraph\",\n\
          \                \"text\": text\n            })\n\n    return result\n\n\
          \ndef main(\n    confirmed_tree_json: str,\n    standard_reference_json:\
          \ str,\n    cover_json: str,\n    document_plan_json: str,\n    warnings_json:\
          \ str = \"\",\n    document_type: str = \"\",\n    template_id: str = \"\
          \",\n    template_version: str = \"\",\n    standard_reference_count: str\
          \ = \"\",\n    standard_reference_matched_count: str = \"\",\n    standard_reference_text_count:\
          \ str = \"\"\n) -> dict:\n    tree = parse_json(confirmed_tree_json, [])\n\
          \    references = parse_json(standard_reference_json, [])\n    cover = parse_json(cover_json,\
          \ {})\n    document_plan = parse_json(document_plan_json, {})\n    warnings\
          \ = parse_json(warnings_json, [])\n\n    if not isinstance(tree, list):\n\
          \        tree = []\n    if not isinstance(references, list):\n        references\
          \ = []\n    if not isinstance(warnings, list):\n        warnings = [str(warnings)]\n\
          \n    # confirmed_tree_json に含まれる章節だけを処理する。\n    # 標準テンプレート側の全章節からツリーを再構築しない。\n\
          \    ref_by_id = {}\n    for item in references:\n        if not isinstance(item,\
          \ dict):\n            continue\n        node_id = str(item.get(\"id\") or\
          \ \"\").strip()\n        if node_id:\n            ref_by_id[node_id] = item\n\
          \n    missing_items = []\n    stats = {\n        \"nodes_total\": 0,\n \
          \       \"standard_nodes\": 0,\n        \"manual_nodes\": 0,\n        \"\
          nodes_with_standard_blocks\": 0,\n        \"nodes_with_empty_blocks\": 0,\n\
          \        \"standard_reference_count\": standard_reference_count,\n     \
          \   \"standard_reference_matched_count\": standard_reference_matched_count,\n\
          \        \"standard_reference_text_count\": standard_reference_text_count\n\
          \    }\n\n    def apply_standard_text(node):\n        stats[\"nodes_total\"\
          ] += 1\n\n        node_id = str(node.get(\"id\") or \"\").strip()\n    \
          \    source = str(node.get(\"source\") or \"standard\").strip()\n      \
          \  ref = ref_by_id.get(node_id, {})\n\n        if source == \"standard\"\
          :\n            stats[\"standard_nodes\"] += 1\n            blocks = normalize_blocks(ref.get(\"\
          standard_blocks\"))\n        else:\n            # 手動追加ノードには標準本文を入れない。\n\
          \            stats[\"manual_nodes\"] += 1\n            blocks = []\n\n \
          \       # 標準原文がなければ空配列。推測文・対象外文・別途確認文は生成しない。\n        node[\"blocks\"] =\
          \ blocks\n\n        if blocks:\n            stats[\"nodes_with_standard_blocks\"\
          ] += 1\n        else:\n            stats[\"nodes_with_empty_blocks\"] +=\
          \ 1\n\n        applicability = node.get(\"applicability\") or \"applicable\"\
          \n        if applicability in (\"missing\", \"confirm\"):\n            missing_items.append({\n\
          \                \"section_id\": node.get(\"id\"),\n                \"source_template_number\"\
          : node.get(\"source_template_number\"),\n                \"title\": node.get(\"\
          title\"),\n                \"item\": node.get(\"title\"),\n            \
          \    \"reason\": node.get(\"reason\") or \"設計条件の確認が必要です。\"\n           \
          \ })\n\n        if \"selected\" not in node:\n            node[\"selected\"\
          ] = True\n\n    walk(tree, apply_standard_text)\n\n    seen = set()\n  \
          \  dedup_missing = []\n    for item in missing_items:\n        if isinstance(item,\
          \ dict):\n            key = (\n                item.get(\"section_id\"),\n\
          \                item.get(\"item\"),\n                item.get(\"reason\"\
          )\n            )\n        else:\n            key = (str(item), \"\", \"\"\
          )\n\n        if key in seen:\n            continue\n        seen.add(key)\n\
          \        dedup_missing.append(item)\n\n    result = {\n        \"status\"\
          : \"success\",\n        # HTML互換のため既存stage名を維持する。\n        \"stage\": \"\
          content_generate_v3\",\n        \"content_mode\": \"standard_template_copy\"\
          ,\n        \"document_type\": str(document_type or \"\"),\n        \"template_id\"\
          : str(template_id or \"\"),\n        \"template_version\": str(template_version\
          \ or \"\"),\n        \"cover\": cover,\n        \"document_plan\": document_plan,\n\
          \        \"chapters\": tree,\n        \"missing_items\": dedup_missing,\n\
          \        \"warnings\": warnings,\n        \"generation_stats\": stats\n\
          \    }\n\n    return {\n        \"result_json\": json.dumps(result, ensure_ascii=False)\n\
          \    }\n"
