          \        is_standard_node = source == \"standard\"\n\n        if is_standard_node:\n\
          \            if source_number and source_number in by_key:\n           \
          \     matched = by_key[source_number]\n                matched_by = \"source_template_number\"\
          \n            elif node_id and node_id in by_key:\n                matched\
          \ = by_key[node_id]\n                matched_by = \"id\"\n\n        blocks\
          \ = item_blocks(matched) if matched else []\n\n        result.append({\n\
          \            \"id\": node_id,\n            \"source_template_number\": source_number,\n\
          \            \"title\": title,\n            \"level\": node.get(\"level\"\
          ),\n            \"source\": source,\n            \"is_standard_node\": is_standard_node,\n\
          \            \"matched\": matched is not None,\n            \"matched_by\"\
          : matched_by,\n            \"standard_blocks\": blocks\n        })\n\n \
          \   walk(tree, add)\n    return result\n\n\ndef main(\n    input_json: str,\n\
          \    document_type: str = \"\",\n    template_id: str = \"\",\n    template_version:\
          \ str = \"\",\n    section_contents_json: str = \"\",\n    reference_text:\
          \ str = \"\"\n) -> dict:\n    payload = parse_json(input_json, {})\n   \
          \ if not isinstance(payload, dict):\n        payload = {}\n\n    stage =\
