          \ = (\n        document_plan.get(\"summary\")\n        or payload.get(\"\
          project_summary\")\n        or payload.get(\"summary\")\n        or \"\"\
          \n    )\n\n    project_summary_obj = {\n        \"stage\": stage,\n    \
          \    \"document_type\": resolved_document_type,\n        \"template_id\"\
