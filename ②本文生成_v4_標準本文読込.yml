        code: "import json\nimport re\n\n\ndef parse_json(value):\n    if isinstance(value,\
          \ dict):\n        return value\n\n    text = str(value or \"\").strip()\n\
          \    text = re.sub(r\"^```json\\s*\", \"\", text)\n    text = re.sub(r\"\
          ^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\", \"\", text)\n\n\
          \    if not text:\n        return {}\n\n    if not text.startswith(\"{\"\
          ):\n        start = text.find(\"{\")\n        if start >= 0:\n         \
          \   text = text[start:]\n\n    end = text.rfind(\"}\")\n    if end >= 0:\n\
          \        text = text[:end + 1]\n\n    return json.loads(text)\n\n\ndef main(llm_text:\
          \ str) -> dict:\n    data = parse_json(llm_text)\n    fixed_text = str(data.get(\"\
          text\") or \"\").strip()\n\n    if not fixed_text:\n        raise ValueError(\"\
          段落修正結果に text がありません。\")\n\n    result = {\n        \"status\": \"success\"\
          ,\n        \"stage\": \"paragraph_fix\",\n        \"text\": fixed_text\n\
          \    }\n\n    return {\n        \"result_json\": json.dumps(result, ensure_ascii=False)\n\
          \    }"
