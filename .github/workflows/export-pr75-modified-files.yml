name: Export PR75 modified files

on:
  push:
    branches:
      - codex/-word-um6b64
    paths:
      - '.github/workflows/export-pr75-modified-files.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source bundle
        shell: bash
        run: |
          zip -r pr75_modified_files.zip \
            '.github/workflows/package-standard-word-plugin.yml' \
            'dify/company/workflows/②本文生成_v4_標準本文読込.yml' \
            'docs/DIFY_WORD_METADATA_PASSTHROUGH_UPDATE.md' \
            'plugins/personal/standard_word_generator/README.md' \
            'plugins/personal/standard_word_generator/manifest.yaml' \
            'plugins/personal/standard_word_generator/tools/chapter_parser.py' \
            'plugins/personal/standard_word_generator/tools/docx_builder.py' \
            'tests/test_metadata_passthrough.py' \
            '基本設計書generator.html'
          unzip -l pr75_modified_files.zip

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr75_modified_files
          path: pr75_modified_files.zip
          retention-days: 7
