name: Build local Windows app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r local_backend/requirements.txt
      - run: pytest -q
      - run: pyinstaller --noconfirm 基本設計書生成ツール.spec
      - shell: pwsh
        run: Compress-Archive -Path 'dist/基本設計書生成ツール.exe' -DestinationPath '基本設計書生成ツール-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: 基本設計書生成ツール-Windows
          path: 基本設計書生成ツール-Windows.zip
