name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [codex/local-desktop-v2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r local_backend/requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Build one-file executable
        run: pyinstaller --noconfirm "基本設計書生成ツール.spec"
      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $env:DDG_HEADLESS_SMOKE = "1"
          $process = Start-Process -FilePath "dist/基本設計書生成ツール.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8765/api/health" -UseBasicParsing
                $body = $response.Content | ConvertFrom-Json
                if ($body.status -eq "ok" -and $response.Headers["X-Detail-Design-Generator"] -eq "local-desktop-v2") {
                  $ready = $true
                  break
                }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "Packaged backend did not become healthy" }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: 基本設計書生成ツール-windows
          path: dist/基本設計書生成ツール.exe
          if-no-files-found: error
