      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: 成功分岐またはエラー分岐のうち、実行された側のresultを統合します。
        output_type: object
        selected: false
        title: 結果統合
