      height: 178
      id: result_aggregator
      position:
        x: 1210
        y: 295
      positionAbsolute:
        x: 1210
        y: 295
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "def main(result: dict) -> dict:\n    result = result or {}\n    return\
          \ {\n        \"status\": str(result.get(\"status\") or \"error\"),\n   \
          \     \"document_type\": str(result.get(\"document_type\") or \"\"),\n \
          \       \"template_id\": str(result.get(\"template_id\") or \"\"),\n   \
          \     \"template_version\": str(result.get(\"template_version\") or \"\"\
          ),\n        \"master_json\": result.get(\"master_json\") or [],\n      \
          \  \"chapter_list_json\": result.get(\"chapter_list_json\") or [],\n   \
          \     \"heading_1_count\": int(result.get(\"heading_1_count\") or 0),\n\
          \        \"heading_2_count\": int(result.get(\"heading_2_count\") or 0),\n\
          \        \"heading_3_count\": int(result.get(\"heading_3_count\") or 0),\n\
          \        \"errors\": [str(v) for v in (result.get(\"errors\") or [])],\n\
          \        \"warnings\": [str(v) for v in (result.get(\"warnings\") or [])],\n\
          \        \"message\": str(result.get(\"message\") or \"\"),\n    }"
        code_language: python3
        desc: 統合結果をワークフローAPIの個別出力変数へ展開します。
        outputs:
          chapter_list_json:
            children: null
            type: array[object]
          document_type:
