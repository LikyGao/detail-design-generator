    - data:
        code: "def main(document_type: str, error_type: str, error_message: str) ->\
          \ dict:\n    raw_message = str(error_message or \"\").strip()\n    error_type\
          \ = str(error_type or \"\").strip()\n\n    if \"登録できるファイルは.docxのみ\" in raw_message:\n\
          \        message = \"DOCXファイルのみ登録できます。アップロードしたファイル形式を確認してください。\"\n    elif\
          \ \"Heading 1～3から章節を抽出できませんでした\" in raw_message:\n        message = (\n\
          \            \"章節を抽出できませんでした。\"\n            \"標準テンプレート本文にHeading 1を設定し、必要に応じてHeading\
          \ 2・Heading 3を設定してください。\"\n        )\n    elif \"必要なWordスタイルがありません\" in\
          \ raw_message:\n        message = (\n            \"標準テンプレートに必要なWordスタイルがありません。\"\
          \n            \"Normal、Heading 1、Heading 2、Heading 3、Captionを確認してください。\"\
          \n        )\n    elif \"有効なDOCX\" in raw_message or \"Wordテンプレートを開けません\"\
          \ in raw_message:\n        message = \"DOCXファイルが破損しているか、Word文書として読み取れません。\"\
          \n    elif raw_message:\n        message = raw_message\n    else:\n    \
          \    message = \"標準テンプレートの登録・解析に失敗しました。\"\n\n    errors = [message]\n  \
          \  if raw_message and raw_message != message:\n        errors.append(\"\
          詳細: \" + raw_message)\n    if error_type:\n        errors.append(\"エラー種別:\
          \ \" + error_type)\n\n    return {\n        \"result\": {\n            \"\
          status\": \"error\",\n        \"document_type\": str(document_type or \"\
          \"),\n        \"template_id\": \"\",\n        \"template_version\": \"\"\
          ,\n        \"master_json\": [],\n        \"chapter_list_json\": [],\n  \
          \      \"heading_1_count\": 0,\n        \"heading_2_count\": 0,\n      \
          \  \"heading_3_count\": 0,\n        \"errors\": errors,\n        \"warnings\"\
          : [],\n            \"message\": message,\n        }\n    }"
        code_language: python3
        desc: プラグイン例外を明確な日本語エラーへ整形します。
        outputs:
          result:
            children:
              chapter_list_json:
                children: null
                type: array[object]
              document_type:
                children: null
                type: string
              errors:
                children: null
                type: array[string]
              heading_1_count:
                children: null
                type: number
              heading_2_count:
                children: null
                type: number
              heading_3_count:
                children: null
                type: number
              master_json:
                children: null
                type: array[object]
              message:
                children: null
                type: string
              status:
                children: null
                type: string
              template_id:
                children: null
                type: string
              template_version:
                children: null
                type: string
              warnings:
                children: null
                type: array[string]
            type: object
        selected: false
        title: エラー整形
        type: code
        variables:
        - value_selector:
          - start
          - document_type
          variable: document_type
        - value_selector:
          - register_template
          - error_type
          variable: error_type
        - value_selector:
          - register_template
          - error_message
          variable: error_message
      height: 96
      id: format_error
