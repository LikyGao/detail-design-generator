    - data:
        desc: v0.0.7のregister_standard_templateを使用し、DOCX保存、Heading解析、Master生成を一括実行します。
        error_strategy: fail-branch
        provider_id: likygao/standard_word_generator/standard_word_generator
        provider_name: likygao/standard_word_generator/standard_word_generator
        provider_type: builtin
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 1000
        selected: true
        title: 標準テンプレート登録・解析
        tool_configurations: {}
        tool_description: DOCXを検証し、Heading 1～3を抽出して、指定文書種別の現在テンプレートを上書き登録します。
        tool_label: 標準テンプレート登録・解析
        tool_name: register_standard_template
        tool_node_version: '2'
        tool_parameters:
          document_type:
            type: mixed
            value: '{{#start.document_type#}}'
          template_file:
            type: variable
            value:
            - start
            - template_file
        type: tool
      height: 148
      id: register_template
      position:
        x: 430
        y: 260
      positionAbsolute:
        x: 430
        y: 260
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "def main(\n    document_type: str,\n    template_version: str,\n  \
          \  template: dict,\n    master_json: list,\n    chapter_list_json: list,\n\
          \    warnings: list,\n) -> dict:\n    template = template or {}\n    master_json\
          \ = master_json or []\n    chapter_list_json = chapter_list_json or []\n\
          \    parse_warnings = [str(item) for item in (warnings or []) if str(item).strip()]\n\
          \n    validation = template.get(\"validation\") or {}\n    validation_warnings\
          \ = [\n        str(item) for item in (validation.get(\"warnings\") or [])\
          \ if str(item).strip()\n    ]\n\n    combined_warnings = []\n    for item\
          \ in parse_warnings + validation_warnings:\n        if item not in combined_warnings:\n\
          \            combined_warnings.append(item)\n\n    chapter_summary = template.get(\"\
          chapter_summary\") or {}\n    heading_1_count = int(chapter_summary.get(\"\
          heading_1_count\") or 0)\n    heading_2_count = int(chapter_summary.get(\"\
          heading_2_count\") or 0)\n    heading_3_count = int(chapter_summary.get(\"\
          heading_3_count\") or 0)\n\n    hierarchy_markers = (\n        \"Heading\
          \ 1より前のHeading 2\",\n        \"親Heading 2がないHeading 3\",\n    )\n    hierarchy_errors\
          \ = [\n        item\n        for item in combined_warnings\n        if any(marker\
          \ in item for marker in hierarchy_markers)\n    ]\n\n    if hierarchy_errors:\n\
          \        status = \"error\"\n        errors = [\n            \"章節階層に異常があります。Heading\
          \ 1 → Heading 2 → Heading 3 の順序を確認してください。\"\n        ] + hierarchy_errors\n\
          \        message = \"章節階層異常のため、登録結果を成功扱いにしていません。\"\n    else:\n        status\
          \ = \"success\"\n        errors = []\n        message = (\n            \"\
          標準テンプレートを登録・解析しました。\"\n            f\" Heading 1: {heading_1_count}件、\"\n\
          \            f\"Heading 2: {heading_2_count}件、\"\n            f\"Heading\
          \ 3: {heading_3_count}件。\"\n        )\n\n    return {\n        \"result\"\
          : {\n            \"status\": status,\n        \"document_type\": str(document_type\
          \ or template.get(\"document_type\") or \"\"),\n        \"template_id\"\
          : str(template.get(\"id\") or \"\"),\n        \"template_version\": str(\n\
          \            template_version or template.get(\"template_version\") or \"\
          \"\n        ),\n        \"master_json\": master_json,\n        \"chapter_list_json\"\
          : chapter_list_json,\n        \"heading_1_count\": heading_1_count,\n  \
          \      \"heading_2_count\": heading_2_count,\n        \"heading_3_count\"\
          : heading_3_count,\n        \"errors\": errors,\n        \"warnings\": combined_warnings,\n\
          \            \"message\": message,\n        }\n    }"
        code_language: python3
        desc: プラグイン出力を管理用レスポンスへ整形し、章節階層警告をエラーとして判定します。
        outputs:
          result:
            children:
              chapter_list_json:
                children: null
                type: array[object]
              document_type:
                children: null
                type: string
              errors:
                children: null
                type: array[string]
              heading_1_count:
                children: null
                type: number
              heading_2_count:
                children: null
                type: number
              heading_3_count:
                children: null
                type: number
              master_json:
                children: null
                type: array[object]
              message:
                children: null
                type: string
              status:
                children: null
                type: string
              template_id:
                children: null
                type: string
              template_version:
                children: null
                type: string
              warnings:
                children: null
                type: array[string]
            type: object
        selected: false
        title: 登録結果整形
        type: code
        variables:
        - value_selector:
