    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 動的に受信した標準章節リストの全IDを、共通案件プロファイルに基づいて判定する。文書種別固有ロジックは持たない。
        model:
          completion_params:
            max_completion_tokens: 12000
          mode: chat
          name: gpt4omini-dify-t0000-240806
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: decision-system
          role: system
          text: 'あなたは日本語インフラ基本設計書の標準章節適用性判定担当です。


            動的に受信した標準章節リストに含まれる全章節について、案件情報と整理済み案件プロファイルに明記された事実だけを根拠として適用性を判定してください。


            server_storage、network、cloud、full のいずれでも同じ判定規則を使用します。

            文書種別名だけを根拠に、製品、機能、構成、章節の適用性を推測してはいけません。


            標準章節の追加、削除、名称変更、ID変更は行わず、各章節の判定結果だけを出力してください。'
        - id: decision-user
          role: user
          text: "あなたは、日本語の基本設計書における章節適用性判定の専門家です。\n\n# 文書種別\n{{#start.document_type#}}\n\
            \n# 案件情報\n{{#start.input_json#}}\n\n# 整理済み案件プロファイル\n{{#17848009024030.text#}}\n\
            \n# 標準章節リスト\n{{#start.chapter_list_json#}}\n\n# 判定の基本原則\n\n- 標準章節リストのタイトル、階層、IDを正とする\n\
            - 案件情報と整理済み案件プロファイルに明記された事実だけを根拠にする\n- domain_details の key、label、value、status、evidence\
            \ を章節タイトルと照合する\n- 文書種別名だけを根拠に適用性を決めない\n- 一般的な設計慣行、製品知識、経験から不足情報を補完しない\n\
            - full は独立した標準テンプレートとして扱い、他の文書種別の合成とみなさない\n\n# applicability\n\napplicable:\n\
            案件の対象であり、その章節を基本設計書へ記載するために必要な情報が判定可能な範囲で確認できる。\n\nnot_applicable:\n「対象外」「使用しない」「導入しない」「構築しない」「実施しない」など、明確な対象外根拠が案件情報に存在する。\n\
            \nmissing:\n章節自体は対象である、または対象である可能性が高いが、本文に必要な製品、方式、容量、構成、期間、時刻、対象範囲などの詳細が不足または未定である。\n\
            \nconfirm:\n現在の案件情報だけでは、その章節自体が案件の対象か対象外かを判断できない。\n\n# status との対応\n\n\
            confirmed:\n原則として applicable。\nただし、章節本文に必要な詳細が不足している場合は missing。\n\nundecided:\n\
            対象であることが分かる場合は missing。\n対象かどうか自体が分からない場合は confirm。\n\nnot_applicable:\n\
            対応する章節は not_applicable。\n\n# 厳守事項\n\n- 標準章節リストに含まれるすべてのIDを必ず1回ずつ出力する\n\
            - level=1、level=2、level=3を省略しない\n- 標準章節リストに存在しないIDを追加しない\n- ID、source_template_number、title、levelを変更しない\n\
            - 標準章節リストと同じ順番で出力する\n- 案件情報に記載がないだけで not_applicable にしない\n- 「詳細未定」「情報不足」「別途確認」「検討中」を理由に\
            \ not_applicable にしない\n- 明確な対象外根拠がなければ confirm または missing にする\n- reason\
            \ に「対象外ではない」「詳細が未定」「情報が不足している」と記載する場合、not_applicable にしない\n\n# 親子章節ルール\n\
            \n- 親章節が明確に not_applicable の場合、その配下も原則 not_applicable\n- 子章節のいずれかが applicable、missing、confirm\
            \ の場合、親章節を not_applicable にしない\n- 採用、導入、構築、実施が確認されている機能の配下は、詳細が未定でも not_applicable\
            \ にせず missing とする\n- 対象かどうか自体が判断できない子章節は confirm とする\n\n# 共通判定例\n\n例1：domain_details\
            \ に「無線LANを導入する」、status=confirmed とある。\n- 「無線LAN」章節：applicable\n- 無線LAN配下の具体的な認証方式が未定：missing\n\
            \n例2：domain_details に「バックアップは実施するが保存期間は未定」とある。\n- 「バックアップ」章節：missing\n\
            - 「保存期間」章節：missing\n\n例3：domain_details に「ロードバランサーは使用しない」、status=not_applicable\
            \ とある。\n- 「ロードバランサー」章節：not_applicable\n- その配下の章節：not_applicable\n\n例4：案件情報に回線を使用するかどうかの記載がない。\n\
            - 「回線」章節：confirm\n- 情報がないだけなので not_applicable にしない\n\n# reason\n\n判定根拠を日本語で簡潔に記載する。\n\
            \n良い例：\n- 「無線LANの導入が確認されているため。」\n- 「バックアップは実施するが、保存期間が未定であるため。」\n- 「案件情報から回線が対象かどうか判断できないため。」\n\
            - 「ロードバランサーを使用しないことが明記されているため。」\n\n悪い例：\n- 「情報がないため対象外。」\n- 「詳細が未定であるため対象外。」\n\
            - 「対象外ではないが、not_applicable。」\n\n# 出力前確認\n\n- 標準章節リストの全IDが含まれている\n- level=3のIDも含まれている\n\
            - IDの重複、追加、削除、変更がない\n- 標準章節リストと同じ順番である\n- 明確な対象外根拠がない章節を not_applicable\
            \ にしていない\n- 詳細未定の章節を not_applicable にしていない\n- 親子章節の判定が矛盾していない\n\n# 出力形式\n\
            \n以下のJSONだけを出力する。\n\n{\n  \"decisions\": [\n    {\n      \"id\": \"標準章節リストに存在するID\"\
            ,\n      \"applicability\": \"applicable | not_applicable | missing |\
            \ confirm\",\n      \"reason\": \"判定理由\"\n    }\n  ]\n}\n\n- generation_policy\
            \ やその他の項目は出力しない\n- JSON以外の説明文、Markdown、コードブロックは禁止"
        selected: false
        title: 章節適用性判定
        type: llm
        variables: []
        vision:
          enabled: false
      height: 148
      id: section_decision_llm
      position:
        x: 720
        y: 280
      positionAbsolute:
        x: 720
        y: 280
      selected: false
      type: custom
      width: 242
    - data:
        code: "import json\nimport re\n\n\ndef parse_json(value):\n    if isinstance(value,\
          \ (dict, list)):\n        return value\n\n    text = str(value or \"\").strip()\n\
          \n    # Markdown代码块去除\n    text = re.sub(r\"^```json\\s*\", \"\", text)\n\
          \    text = re.sub(r\"^```\\s*\", \"\", text)\n    text = re.sub(r\"\\s*```$\"\
          , \"\", text)\n\n    # 去除JSON前面的说明文字\n    if not (text.startswith(\"{\"\
          ) or text.startswith(\"[\")):\n        first_obj = text.find(\"{\")\n  \
          \      first_arr = text.find(\"[\")\n        starts = [x for x in (first_obj,\
          \ first_arr) if x >= 0]\n\n        if starts:\n            text = text[min(starts):]\n\
          \n    # 去除JSON后面的说明文字\n    if text.startswith(\"{\"):\n        end = text.rfind(\"\
          }\")\n        if end >= 0:\n            text = text[:end + 1]\n\n    elif\
          \ text.startswith(\"[\"):\n        end = text.rfind(\"]\")\n        if end\
          \ >= 0:\n            text = text[:end + 1]\n\n    if not text:\n       \
          \ return {}\n\n    return json.loads(text)\n\n\ndef force_not_applicable(node,\
          \ reason):\n    \"\"\"\n    父章節が対象外の場合に、配下をすべて対象外にする。\n    \"\"\"\n    node[\"\
          applicability\"] = \"not_applicable\"\n    node[\"selected\"] = False\n\n\
          \    if not node.get(\"reason\"):\n        node[\"reason\"] = reason\n\n\
          \    for child in node.get(\"children\") or []:\n        force_not_applicable(\n\
          \            child,\n            \"親章節が対象外のため。\"\n        )\n\n\ndef normalize_hierarchy(node):\n\
          \    \"\"\"\n    子から親へ判定を確認し、親子の矛盾を修正する。\n    \"\"\"\n    children = node.get(\"\
          children\") or []\n\n    # 先に子章節を正規化\n    for child in children:\n     \
          \   normalize_hierarchy(child)\n\n    if not children:\n        return\n\
          \n    child_statuses = [\n        child.get(\"applicability\", \"confirm\"\
          )\n        for child in children\n    ]\n\n    has_applicable = \"applicable\"\
          \ in child_statuses\n    has_missing = \"missing\" in child_statuses\n \
          \   has_confirm = \"confirm\" in child_statuses\n\n    # 子章節が適用対象なのに親が対象外の場合、親を適用側へ引き上げる\n\
          \    if node.get(\"applicability\") == \"not_applicable\":\n        if has_applicable:\n\
          \            node[\"applicability\"] = \"applicable\"\n            node[\"\
          selected\"] = True\n            node[\"reason\"] = (\n                \"\
          配下に適用対象の章節が存在するため。\"\n            )\n\n        elif has_missing:\n     \
          \       node[\"applicability\"] = \"missing\"\n            node[\"selected\"\
          ] = True\n            node[\"reason\"] = (\n                \"配下に情報不足の適用章節が存在するため。\"\
          \n            )\n\n        elif has_confirm:\n            node[\"applicability\"\
          ] = \"confirm\"\n            node[\"selected\"] = True\n            node[\"\
          reason\"] = (\n                \"配下に適用確認が必要な章節が存在するため。\"\n            )\n\
          \n    # 親が最終的に対象外なら、配下もすべて対象外に統一\n    if node.get(\"applicability\") ==\
          \ \"not_applicable\":\n        for child in children:\n            force_not_applicable(\n\
          \                child,\n                \"親章節が対象外のため。\"\n            )\n\
          \n\ndef collect_result_data(nodes):\n    \"\"\"\n    階層修正後に統計と確認事項を作成する。\n\
          \    \"\"\"\n    stats = {\n        \"applicable\": 0,\n        \"not_applicable\"\
          : 0,\n        \"missing\": 0,\n        \"confirm\": 0\n    }\n\n    missing_items\
          \ = []\n\n    def collect(node):\n        applicability = node.get(\n  \
          \          \"applicability\",\n            \"confirm\"\n        )\n\n  \
          \      if applicability not in stats:\n            applicability = \"confirm\"\
          \n            node[\"applicability\"] = \"confirm\"\n            node[\"\
          selected\"] = True\n\n        stats[applicability] += 1\n\n        if applicability\
          \ in (\"missing\", \"confirm\"):\n            reason = node.get(\"reason\"\
          ) or (\n                \"適用性の判断または設計条件の確認が必要です。\"\n            )\n\n  \
          \          node[\"reason\"] = reason\n\n            missing_items.append({\n\
          \                \"section_id\": node.get(\"id\"),\n                \"source_template_number\"\
          :\n                    node.get(\"source_template_number\"),\n         \
          \       \"title\": node.get(\"title\"),\n                \"item\": node.get(\"\
          title\"),\n                \"reason\": reason\n            })\n\n      \
          \  for child in node.get(\"children\") or []:\n            collect(child)\n\
          \n    for node in nodes:\n        collect(node)\n\n    return stats, missing_items\n\
          \n\ndef main(\n    master_json: str,\n    section_decisions_json: str,\n\
          \    case_profile_json: str,\n    input_json: str,\n    document_type: str,\n\
          \    template_id: str,\n    template_version: str\n) -> dict:\n\n    master\
          \ = parse_json(master_json)\n    decision_data = parse_json(section_decisions_json)\n\
          \n    # 個人Difyのテンプレート取得APIが返すmaster_jsonは章節配列。\n    # 旧形式の {\"chapters\"\
          : [...]} にも互換対応する。\n    if isinstance(master, list):\n        chapters =\
          \ master\n        master_meta = {}\n    elif isinstance(master, dict):\n\
          \        chapters = master.get(\"chapters\") or []\n        master_meta\
          \ = master\n    else:\n        chapters = []\n        master_meta = {}\n\
          \n    case_profile = (\n        parse_json(case_profile_json)\n        if\
          \ case_profile_json\n        else {}\n    )\n\n    # decisionsが配列で直接返された場合にも対応\n\
          \    if isinstance(decision_data, list):\n        decisions = decision_data\n\
          \    else:\n        decisions = decision_data.get(\"decisions\", [])\n\n\
          \    allowed = {\n        \"applicable\",\n        \"not_applicable\",\n\
          \        \"missing\",\n        \"confirm\"\n    }\n\n    decision_map =\
          \ {}\n\n    for decision in decisions:\n        if not isinstance(decision,\
          \ dict):\n            continue\n\n        decision_id = decision.get(\"\
          id\")\n\n        if decision_id:\n            decision_map[decision_id]\
          \ = decision\n\n    def apply_decision(node):\n        node_id = node.get(\"\
          id\")\n        decision = decision_map.get(node_id)\n\n        if decision:\n\
          \            applicability = decision.get(\n                \"applicability\"\
          ,\n                \"confirm\"\n            )\n\n            if applicability\
          \ not in allowed:\n                applicability = \"confirm\"\n\n     \
          \       reason = decision.get(\"reason\") or \"\"\n\n            decision_policy\
          \ = (\n                decision.get(\"generation_policy\") or \"\"\n   \
          \         )\n\n            decision_source = \"llm\"\n\n        else:\n\
          \            applicability = \"confirm\"\n            reason = (\n     \
          \           \"章節適用性判定の出力に該当IDがないため、\"\n                \"適用有無の確認が必要です。\"\
          \n            )\n            decision_policy = \"\"\n            decision_source\
          \ = \"default_confirm\"\n\n        # Master側に既存の生成方針があれば保持する\n        master_policy\
          \ = (\n            node.get(\"generation_policy\") or \"\"\n        )\n\n\
          \        generation_policy = (\n            decision_policy or master_policy\n\
          \        )\n\n        node[\"applicability\"] = applicability\n        node[\"\
          selected\"] = (\n            applicability != \"not_applicable\"\n     \
          \   )\n        node[\"reason\"] = reason\n        node[\"generation_policy\"\
          ] = generation_policy\n        node[\"ai_instruction\"] = generation_policy\n\
          \        node[\"decision_source\"] = decision_source\n        node[\"blocks\"\
          ] = node.get(\"blocks\") or []\n\n        for child in node.get(\"children\"\
          ) or []:\n            apply_decision(child)\n\n    # LLM判定をMasterへ合成\n \
          \   for chapter in chapters:\n        apply_decision(chapter)\n\n    # 親子関係の矛盾を確定的に修正\n\
          \    for chapter in chapters:\n        normalize_hierarchy(chapter)\n\n\
          \    # 修正後の状態で統計を作り直す\n    stats, missing_items = collect_result_data(chapters)\n\
          \n    project = case_profile.get(\"project\") or {}\n\n    result = {\n\
          \        \"status\": \"success\",\n        \"stage\": \"chapter_confirm_v3\"\
          ,\n        \"document_type\": str(\n            document_type or master_meta.get(\"\
          document_type\") or \"\"\n        ),\n        \"template_id\": str(\n  \
          \          template_id or master_meta.get(\"template_id\") or \"\"\n   \
          \     ),\n        \"template_version\": str(\n            template_version\
          \ or master_meta.get(\"template_version\") or \"\"\n        ),\n       \
          \ \"cover\": {\n            \"client_name\":\n                project.get(\"\
          client_name\") or \"\",\n            \"project_name\":\n               \
          \ project.get(\"project_name\") or \"\"\n        },\n        \"document_plan\"\
          : {\n            \"summary\": input_json,\n            \"note\": (\n   \
          \             \"標準章節構成に基づき、\"\n                \"各章節の適用性を判定しました。\"\n   \
          \         ),\n            \"decision_stats\": stats\n        },\n      \
          \  \"case_profile\": case_profile,\n        \"chapters\": chapters,\n  \
          \      \"missing_items\": missing_items\n    }\n\n    return {\n       \
          \ \"result_json\": json.dumps(\n            result,\n            ensure_ascii=False\n\
          \        )\n    }\n"
        code_language: python3
        desc: 動的に受信した章節Masterへ共通判定結果を合成し、HTML用result_jsonを作成する。出力形式はv3互換。
