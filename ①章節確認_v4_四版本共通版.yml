    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 文書種別固有の項目名を固定せず、common + domain_details の共通形式へ案件情報を正規化する。旧形式の入力にも対応する。
        isInIteration: false
        isInLoop: false
        model:
          completion_params: {}
          mode: chat
          name: gpt4omini-dify-t0000-240806
          provider: langgenius/azure_openai/azure_openai
        prompt_template:
        - id: profile-system
          role: system
          text: 'あなたは日本語インフラ基本設計書の「章節適用性判定」に使用する案件情報整理担当です。


            入力された案件情報を、文書種別に依存しない共通JSONへ変換してください。


            対象文書種別は次の4種類です。

            - server_storage

            - network

            - cloud

            - full


            ただし、文書種別ごとの製品、構成、機能、設計項目を推測してはいけません。

            入力に明記された事実だけを整理してください。


            目的は文章の要約ではなく、次の情報を正確に分類することです。

            - 確定している事項

            - 未定、検討中、候補、要確認の事項

            - 使用しない事項

            - 本案件の対象外事項


            入力に存在しない製品、構成、数量、方式、条件を追加してはいけません。'
        - id: profile-user
          role: user
          text: "# 文書種別\n{{#start.document_type#}}\n\n# 案件情報\n{{#start.input_json#}}\n\
            \n# 入力形式について\n\n推奨入力形式は、次の共通構造です。\n\n{\n  \"document_type\": \"server_storage\
            \ | network | cloud | full\",\n  \"common\": {\n    \"client_name\": \"\
            \",\n    \"project_name\": \"\",\n    \"purpose\": \"\",\n    \"summary\"\
            : \"\",\n    \"scope\": \"\",\n    \"out_of_scope\": \"\"\n  },\n  \"\
            domain_details\": [\n    {\n      \"key\": \"任意の識別子\",\n      \"label\"\
            : \"画面上の項目名\",\n      \"value\": \"入力内容\"\n    }\n  ],\n  \"unknown_items\"\
            : [],\n  \"notes\": \"\"\n}\n\nただし、旧HTMLが送信するフラットなJSONまたは文章形式も受け付けます。\n\
            旧形式の場合も、入力に存在する各項目を共通出力形式の project、scope、domain_details、constraints、unknown_items、notes\
            \ に整理してください。\n\n# 厳守事項\n\n- JSONだけを出力する\n- Markdown、説明文、コードブロックは禁止\n-\
            \ 指定されたJSONキーを省略しない\n- 入力に書かれていない情報を追加しない\n- 文書種別から一般的な設計内容を推測しない\n- 一般的な設計慣行や経験を根拠に情報を補完しない\n\
            - 製品名、構成、数量、方式、対象範囲を推測しない\n- 否定表現を肯定情報として扱わない\n- 同一内容を重複登録しない\n- 空欄の入力項目は\
            \ domain_details に追加しない\n- 入力に全く記載されていない項目を unknown_items に追加しない\n- evidence\
            \ には判断根拠となった入力中の短い表現を記載する\n- full は独立した標準テンプレートであり、他の文書種別を合成したものとして扱わない\n\
            \n# status の定義\n\nconfirmed:\n採用、使用、導入、構築、実施、対象、決定済みであることが明記されている。\n\n\
            undecided:\n未定、検討中、候補、予定、要確認、別途確認など、まだ確定していない。\n\nnot_applicable:\n使用しない、導入しない、構築しない、実施しない、本案件の対象外であることが明記されている。\n\
            \n# 正規化ルール\n\n- document_type は START の document_type をそのまま使用する\n- common.client_name、client、customer、顧客名などは\
            \ project.client_name に整理する\n- common.project_name、project、案件名、プロジェクト名などは\
            \ project.project_name に整理する\n- 目的は project.purpose、案件概要は project.summary\
            \ に整理する\n- 対象範囲は scope.in_scope、対象外範囲は scope.out_of_scope に整理する\n- domain_details\
            \ の key と label は可能な限り入力値を保持する\n- domain_details の value に複数の独立事項が含まれる場合は、必要に応じて複数要素へ分割する\n\
            - 同じ事実を scope と domain_details の両方に登録してよい\n- 実施自体が確定し、詳細だけが未定の場合は、実施事項を\
            \ confirmed、未定の詳細を undecided として分ける\n- 「導入予定」「実施予定」は undecided とする\n-\
            \ 「導入する」「実施する」「採用することが決定している」は confirmed とする\n- 明示された未定事項は unknown_items\
            \ にも登録してよい\n- 制約、期限、既存環境踏襲、利用禁止条件などは constraints に整理する\n\n# domain_details\
            \ の各要素\n\n{\n  \"key\": \"入力項目の識別子。存在しない場合は空文字\",\n  \"label\": \"入力項目名または対象項目名\"\
            ,\n  \"value\": \"入力に記載された内容\",\n  \"status\": \"confirmed | undecided\
            \ | not_applicable\",\n  \"evidence\": \"入力中の判断根拠\"\n}\n\n# scope の各要素\n\
            \n{\n  \"item\": \"対象内容\",\n  \"evidence\": \"入力中の判断根拠\"\n}\n\n# constraints\
            \ の各要素\n\n{\n  \"item\": \"制約内容\",\n  \"status\": \"confirmed | undecided\"\
            ,\n  \"evidence\": \"入力中の判断根拠\"\n}\n\n# unknown_items の各要素\n\n{\n  \"\
            item\": \"入力上で明示的に未定、検討中、要確認である内容\",\n  \"evidence\": \"入力中の判断根拠\"\n}\n\
            \n# 出力形式\n\n{\n  \"document_type\": \"{{#start.document_type#}}\",\n \
            \ \"project\": {\n    \"client_name\": \"\",\n    \"project_name\": \"\
            \",\n    \"purpose\": \"\",\n    \"summary\": \"\"\n  },\n  \"scope\"\
            : {\n    \"in_scope\": [],\n    \"out_of_scope\": []\n  },\n  \"domain_details\"\
            : [],\n  \"constraints\": [],\n  \"unknown_items\": [],\n  \"notes\":\
            \ []\n}"
